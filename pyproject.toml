[project]
name = "tinyserve"
version = "0.1.0"
description = "A from-scratch LLM inference runtime: continuous batching, KV-cache management, and fair scheduling on top of llama.cpp"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "llama-cpp-python>=0.3.34",
    "prometheus-client>=0.26.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28.1",
    "py-spy>=0.4.2",
    "matplotlib>=3.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tinyserve"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "slow: integration tests that load a real GGUF model",
]
testpaths = ["tests"]
